name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "ritvik/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ritvik/package-lock.json

      - name: Install dependencies
        working-directory: ritvik
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static export
        working-directory: ritvik
        run: npm run build

      - name: Add .nojekyll
        run: touch ritvik/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ritvik/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
